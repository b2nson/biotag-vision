; BioTag ESP32-CAM streamer (AI-Thinker ESP32-CAM, OV2640)
; Copy include/secrets.example.h to include/secrets.h and edit it first.
; Flash with an FTDI adapter or ESP32-CAM-MB board:  pio run -t upload
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -D BOARD_HAS_PSRAM
