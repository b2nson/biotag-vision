; BioTag lid controller - ESP32 DevKit (ESP32-WROOM-32)
; Build + flash:  pio run -t upload      Monitor:  pio device monitor
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
build_flags =
    -D USE_BEAM=1        ; 0 = no break-beam sensors, lids close on the timer only
