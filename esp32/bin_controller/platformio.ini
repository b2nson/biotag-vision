; BioTag bin controller (ESP32-S3). Build + flash: pio run -t upload   Monitor: pio device monitor
; src_dir = . lets PlatformIO build bin_controller.ino where it sits, and gives VS Code the Arduino core for IntelliSense.
[platformio]
src_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
